# Desarrollo: base de datos en fichero, sin necesitar variables de entorno.
# "mvn -Pdev spring-boot:run" arranca sin configurar nada más que los tokens de los bots.
spring.datasource.url=jdbc:h2:file:./target/cah-telegram;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.locations=classpath:db/migration/h2

server.port=8080

spring.h2.console.enabled=true

# En desarrollo los bots vienen apagados: hay que dar un token de verdad para encenderlos
cclh.bot.enabled=false
dictionaries.bot.enabled=false

logging.level.org.themarioga=debug
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=warn
logging.level.org.springframework=info
logging.level.root=info
